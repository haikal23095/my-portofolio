name: Deploy to Production VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Compute Engine via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          script: |
            # Enable command tracing and exit on error
            set -e

            # Load profile configuration for login shell (loads NVM, npm, node etc. if installed via NVM)
            if [ -f ~/.bashrc ]; then source ~/.bashrc; fi
            if [ -f ~/.profile ]; then source ~/.profile; fi

            # Navigate to project directory (configurable via GitHub Secrets)
            cd "${{ secrets.PROJECT_PATH }}"

            # Mark directory as safe to fix 'dubious ownership' error
            sudo git config --global --add safe.directory "${{ secrets.PROJECT_PATH }}"

            # Optional: Clean any local changes on the server to prevent conflicts
            sudo git reset --hard HEAD

            # Pull latest changes
            sudo git pull origin main

            # Install dependencies and build
            sudo npm install
            sudo npm run build

            echo "Deployment completed successfully!"
